<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar Guru · Rihlah Ilmu</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f1e8;--card:#fff;--ink:#1d2433;--muted:#6b6f7c;--line:#e8e1d0;--night:#14213d;--gold:#e7b84a;--ok:#2e9e7a}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--night);color:#fff;padding:22px 18px 26px;text-align:center}
header .ar{font-family:'Amiri',serif;color:var(--gold);font-size:22px}
header h1{margin:4px 0 0;font-size:22px}header h1 span{color:var(--gold)}
header p{margin:6px auto 0;max-width:520px;color:#cfd6ea;font-size:14px;line-height:1.5}
.wrap{max-width:560px;margin:-14px auto 30px;padding:0 14px}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 6px 18px rgba(20,33,61,.08)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:0;border-radius:10px;padding:11px;font:inherit;font-weight:700;background:#fff;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--night);color:#fff}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 5px}
label .opt{font-weight:500}
input,textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff}
textarea{min-height:120px;font-size:14px;line-height:1.5}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:800;cursor:pointer;margin-top:14px;background:var(--gold);color:#3b2b05;text-align:center;text-decoration:none}
.btn.plain{background:#eee5cf;color:var(--ink)}.btn.green{background:#25d366;color:#fff}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}.duo .btn{margin-top:8px}
.err{color:#b3261e;font-size:13px;font-weight:600;margin-top:10px;min-height:1px}
.small{font-size:13px;color:var(--muted);line-height:1.5}
.kode{font-size:26px;font-weight:800;letter-spacing:2px;text-align:center;background:#fbecc4;border-radius:12px;padding:12px;margin-top:6px}
.link{font-size:13px;word-break:break-all;background:#f3efe4;border-radius:10px;padding:10px;margin-top:6px;font-family:monospace}
.tag{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#9a6b12}
.note{background:#fff6e3;border:1.5px solid #f0d9a6;border-radius:12px;padding:12px;font-size:13px;line-height:1.55;margin-top:12px}
.warn{background:#fdecec;border-color:#f3c4c1}
ol{padding-left:18px;margin:6px 0}li{margin:4px 0}
details.priv{background:#eef4fb;border:1.5px solid #cfe0f3;border-radius:12px;padding:10px 12px;margin-top:14px;font-size:13px;line-height:1.55}
details.priv summary{cursor:pointer;font-weight:800;color:#1e4f86}
details.priv ul{padding-left:18px;margin:8px 0 2px}
.btn.danger{background:#fdecec;color:#a3261e}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--night);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header><div class="ar">رِحْلَةُ الْعِلْمِ</div><h1>Rihlah <span>Ilmu</span> · Guru</h1>
<p>Daftar gratis untuk memantau capaian belajar siswa Anda di game PAI Rihlah Ilmu. Anda hanya melihat siswa yang memakai kode rombel milik Anda.</p></header>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
const API_URL = /^https:\/\//.test(String(window.RIHLAH_API_URL || "").trim()) ? String(window.RIHLAH_API_URL).trim() : "";
const SITUS = location.origin && location.origin.startsWith('http') ? location.origin + location.pathname.replace(/[^/]*$/, '') : 'https://rihlah-ilmu.github.io/';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');
const simpan = { get(){ try { return JSON.parse(localStorage.getItem('rh_guru') || 'null'); } catch (e) { return null; } }, set(v){ try { localStorage.setItem('rh_guru', JSON.stringify(v)); } catch (e) {} } };
function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 1800); }
async function salin(t){ try { await navigator.clipboard.writeText(t); toast('Tersalin'); } catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); toast('Tersalin'); } }
const PESAN_ERR = {nama_terlalu_pendek: 'Tulis nama Anda (minimal 3 huruf).', sekolah_terlalu_pendek: 'Tulis nama sekolah atau madrasah (minimal 3 huruf).',
  nama_tidak_pantas: 'Nama atau sekolah mengandung kata yang tidak diizinkan.', batas_harian: 'Pendaftaran hari ini sudah penuh. Silakan coba lagi besok.',
  pendaftaran_ditutup: 'Pendaftaran guru sedang ditutup oleh pengelola.', tidak_ditemukan: 'Data tidak ditemukan. Periksa kode rombel dan nomor WA/email yang Anda daftarkan.',
  data_kurang: 'Isi kode rombel dan nomor WA/email.', terlalu_banyak: 'Terlalu banyak percobaan. Demi keamanan, silakan coba lagi 1 jam lagi.'};
const PRIVASI = `<details class="priv"><summary>🔒 Privasi dan keamanan data</summary><ul>
  <li><b>Data yang disimpan:</b> nama, sekolah, dan (bila diisi) nomor WA atau email Anda.</li>
  <li><b>Tujuan:</b> membuat link dashboard dan memulihkannya bila Anda lupa. Tidak dipakai untuk promosi.</li>
  <li><b>Tempat penyimpanan:</b> Google Sheet milik pengelola Rihlah Ilmu, dengan perlindungan akun Google.</li>
  <li><b>Yang bisa melihat:</b> hanya pengelola. Nomor WA/email tidak pernah ditampilkan di game, dashboard, atau kepada guru lain, dan tidak dibagikan ke pihak lain.</li>
  <li><b>Opsional:</b> WA/email boleh dikosongkan. Akibatnya, pemulihan link harus melalui pengelola.</li>
  <li><b>Hapus kapan saja:</b> tombol "Hapus pendaftaran saya" menghapus data Anda dari sistem.</li>
  <li><b>Pengamanan:</b> fitur pemulihan dibatasi 5 percobaan per jam untuk mencegah tebakan.</li></ul>
  <span>Data siswa (nama, kelas, nilai) hanya dapat dilihat oleh pengelola dan guru pemilik kode rombel yang mereka isi.</span></details>`;

async function kirim(body){
  if (!API_URL) { // pratinjau tanpa server
    await new Promise(r => setTimeout(r, 400));
    if (body.action === 'daftarGuru') { const s = String(body.sekolah).toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').split(/\s+/).filter(Boolean).map(w => /^\d+$/.test(w) || ['MA','MAN','MAS','MTS','SMA','SMAN','SMK','PP'].includes(w) ? w : w.slice(0, 3)).join('').slice(0, 7);
      return {ok: true, nama: body.nama, sekolah: body.sekolah, awalan: s + '-K7P', link: SITUS + 'admin.html#g=CONTOHKODEGURU01', aktif: true}; }
    return {ok: false, error: 'tidak_ditemukan'};
  }
  const r = await fetch(API_URL, {method: 'POST', body: JSON.stringify(body)});
  return r.json();
}

function tampil(tab){
  const ada = simpan.get();
  app.innerHTML = `<div class="tabs"><button data-t="daftar" class="${tab === 'daftar' ? 'on' : ''}">Daftar baru</button><button data-t="pulih" class="${tab === 'pulih' ? 'on' : ''}">Lupa link?</button></div>
    ${ada && tab === 'daftar' ? `<div class="card"><div class="tag">Pendaftaran Anda di perangkat ini</div><p style="margin:6px 0 0"><b>${esc(ada.nama)}</b> · ${esc(ada.sekolah)}<br><span class="small">Kode rombel: <b>${esc(ada.awalan)}</b></span></p><button class="btn plain" id="lihat">Lihat link & pesan untuk siswa</button></div>` : ''}
    <div class="card" id="isi"></div>`;
  app.querySelectorAll('.tabs button').forEach(b => b.onclick = () => tampil(b.dataset.t));
  if ($('#lihat')) $('#lihat').onclick = () => hasil(ada);
  tab === 'daftar' ? formDaftar() : formPulih();
}

function formDaftar(){
  $('#isi').innerHTML = `<div class="tag">Daftar sebagai guru</div>
    <label for="nm">Nama guru</label><input id="nm" maxlength="40" placeholder="Contoh: Ustadz Ahmad Fauzi" autocomplete="name">
    <label for="sk">Sekolah atau madrasah</label><input id="sk" maxlength="60" placeholder="Contoh: MAN 2 Semarang">
    <label for="kt">Nomor WA atau email <span class="opt">(dianjurkan, untuk memulihkan link bila lupa)</span></label><input id="kt" maxlength="60" placeholder="Contoh: 0812xxxx atau nama@email.com" inputmode="email">
    <div class="err" id="er"></div>
    <button class="btn" id="ok">Daftar & buat link saya</button>
    <p class="small" style="margin-top:12px">Setelah mendaftar, Anda mendapat <b>kode rombel</b> untuk dibagikan ke siswa dan <b>link dashboard</b> pribadi. Data siswa sekolah lain tidak akan terlihat.</p>${PRIVASI}`;
  $('#ok').onclick = async () => {
    const nama = $('#nm').value.trim(), sekolah = $('#sk').value.trim(), kontak = $('#kt').value.trim();
    if (nama.length < 3) return $('#er').textContent = PESAN_ERR.nama_terlalu_pendek;
    if (sekolah.length < 3) return $('#er').textContent = PESAN_ERR.sekolah_terlalu_pendek;
    $('#ok').disabled = true; $('#ok').textContent = 'Membuat link…'; $('#er').textContent = '';
    try {
      const j = await kirim({action: 'daftarGuru', nama, sekolah, kontak});
      if (!j.ok) throw new Error(j.error);
      simpan.set(j); hasil(j);
    } catch (e) { $('#er').textContent = PESAN_ERR[e.message] || 'Gagal terhubung. Periksa internet lalu coba lagi.'; $('#ok').disabled = false; $('#ok').textContent = 'Daftar & buat link saya'; }
  };
}

function formPulih(){
  $('#isi').innerHTML = `<div class="tag">Pulihkan link guru</div>
    <p class="small">Isi kode rombel Anda (contoh: MAN2SEM-K7P) dan nomor WA atau email yang dipakai saat mendaftar.</p>
    <label for="aw">Kode rombel</label><input id="aw" maxlength="20" placeholder="MAN2SEM-K7P" style="text-transform:uppercase">
    <label for="kt">Nomor WA atau email</label><input id="kt" maxlength="60" placeholder="0812xxxx atau nama@email.com">
    <div class="err" id="er"></div>
    <button class="btn" id="ok">Pulihkan</button>
    <p class="small" style="margin-top:12px">Dulu tidak mengisi WA/email? Hubungi pengelola Rihlah Ilmu dengan menyebutkan nama dan sekolah Anda.</p>${PRIVASI}`;
  $('#ok').onclick = async () => {
    $('#ok').disabled = true; $('#er').textContent = '';
    try {
      const j = await kirim({action: 'pulihkanGuru', awalan: $('#aw').value.trim(), kontak: $('#kt').value.trim()});
      if (!j.ok) throw new Error(j.error);
      simpan.set(j); hasil(j);
    } catch (e) { $('#er').textContent = PESAN_ERR[e.message] || 'Gagal terhubung. Periksa internet lalu coba lagi.'; $('#ok').disabled = false; }
  };
}

function hasil(j){
  const contoh = j.awalan + '-XI-A';
  const situsGame = SITUS.replace(/\/$/, '');
  const pesanSiswa = `Assalamu'alaikum. Ayo belajar PAI lewat game Rihlah Ilmu!\n\n1. Buka ${situsGame}\n2. Ketuk Mulai Perjalanan, tulis nama dan pilih kelas.\n3. Pada "Kode rombel", isi: ${contoh}\n   (ganti XI-A dengan kelasmu, misalnya ${j.awalan}-X-B, atau ${j.awalan}-VIII-A untuk siswa MTs)\n4. Mainkan manzil sesuai tugas dari guru.\n\nSudah terdaftar? Isi kode rombel lewat Paspor > Ubah nama atau kelas.`;
  const pesanSaya = `Link dashboard guru Rihlah Ilmu saya (rahasia):\n${j.link}\n\nKode rombel sekolah: ${j.awalan}`;
  app.innerHTML = `<div class="card"><div class="tag">✅ ${j.aktif ? 'Pendaftaran berhasil' : 'Pendaftaran tercatat'}</div>
      <h2 style="margin:6px 0 0;font-size:20px">${esc(j.nama)}</h2><p class="small" style="margin:2px 0 0">${esc(j.sekolah)}</p>
      ${j.aktif ? '' : '<div class="note warn">Link Anda menunggu persetujuan pengelola. Link akan berfungsi setelah disetujui.</div>'}
      <label>1. Kode rombel untuk siswa</label><div class="kode">${esc(j.awalan)}</div>
      <p class="small" style="margin:6px 0 0">Siswa mengisi kode ini ditambah kelasnya, misalnya <b>${esc(contoh)}</b>. Dengan begitu Anda bisa memfilter per kelas di dashboard.</p>
      <button class="btn plain" id="ck">Salin kode rombel</button>
      <label>2. Link dashboard Anda (rahasia)</label><div class="link">${esc(j.link)}</div>
      <div class="duo"><button class="btn plain" id="cl">Salin link</button><a class="btn" href="${esc(j.link)}" target="_blank" rel="noopener">Buka dashboard</a></div>
      <a class="btn green" href="https://wa.me/?text=${encodeURIComponent(pesanSaya)}" target="_blank" rel="noopener">Simpan link ke WhatsApp saya</a>
      <div class="note"><b>Penting:</b> simpan link ini (misalnya kirim ke WA sendiri atau jadikan bookmark). Jangan bagikan link ke siswa atau orang lain, karena link ini membuka data siswa Anda.</div>
    </div>
    <div class="card"><div class="tag">3. Pesan untuk siswa</div>
      <p class="small">Salin dan kirim ke grup kelas. Boleh diubah sesuai kebutuhan.</p>
      <textarea id="ps">${esc(pesanSiswa)}</textarea>
      <div class="duo"><button class="btn plain" id="cp">Salin pesan</button><a class="btn green" id="wp" href="#" target="_blank" rel="noopener">Kirim via WA</a></div>
    </div>
    <div class="card"><div class="tag">Yang bisa Anda lakukan di dashboard</div>
      <ol class="small"><li>Melihat ringkasan pekanan, daftar siswa, dan peta kemampuan per bab.</li><li>Membuat tugas untuk rombel Anda dan memantau siapa yang sudah selesai.</li><li>Mencetak rapor siswa (bisa disimpan PDF) dan mengunduh data.</li></ol>
      <button class="btn plain" id="bk">Kembali</button></div>
    <div class="card"><div class="tag">Data Anda</div>${PRIVASI}
      <button class="btn danger" id="hp">Hapus pendaftaran saya</button>
      <p class="small" style="margin-top:8px">Menghapus nama, sekolah, kontak, dan link Anda. Link dashboard langsung tidak berlaku. Data permainan siswa tetap tersimpan untuk siswa itu sendiri.</p></div>`;
  $('#ck').onclick = () => salin(j.awalan);
  $('#cl').onclick = () => salin(j.link);
  $('#cp').onclick = () => salin($('#ps').value);
  $('#wp').onclick = e => { e.currentTarget.href = 'https://wa.me/?text=' + encodeURIComponent($('#ps').value); };
  $('#bk').onclick = () => tampil('daftar');
  $('#hp').onclick = async () => {
    if (!confirm('Hapus pendaftaran Anda? Link dashboard akan langsung tidak berlaku dan tidak bisa dipulihkan.')) return;
    const g = String(j.link || '').split('#g=')[1] || '';
    try {
      const r = API_URL ? await kirim({action: 'hapusGuru', g}) : {ok: true};
      if (!r.ok && r.error !== 'tidak_ditemukan') throw new Error(r.error);
      try { localStorage.removeItem('rh_guru'); } catch (e) {}
      app.innerHTML = '<div class="card"><div class="tag">Selesai</div><p>Pendaftaran Anda sudah dihapus dari sistem. Terima kasih telah memakai Rihlah Ilmu.</p><button class="btn plain" id="bk2">Kembali ke halaman awal</button></div>';
      $('#bk2').onclick = () => tampil('daftar');
    } catch (e) { toast('Gagal menghapus. Periksa internet lalu coba lagi.'); }
  };
  window.scrollTo(0, 0);
}

tampil('daftar');
</script>
</body>
</html>
