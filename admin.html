<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin Rihlah Ilmu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f1e8;--card:#fff;--ink:#1d2433;--muted:#6b6f7c;--line:#e8e1d0;--night:#14213d;--gold:#e7b84a}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--night);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;min-width:180px}
header h1 span{color:var(--gold)}
header .upd{font-size:12px;color:#b9c2da}
button,select,input{font:inherit}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:#eee5cf;color:var(--ink)}
.btn.gold{background:var(--gold);color:#3b2b05}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button{border:0;background:#fff;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;color:var(--muted)}
nav button.on{background:var(--night);color:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters select,.filters input{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:28px;font-weight:800}
.kpi span{font-size:13px;color:var(--muted)}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;overflow:auto}
.card h2{font-size:16px;margin:0 0 10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:#faf7f0;position:sticky;top:0;cursor:pointer;white-space:nowrap}
td.num,th.num{text-align:right}
tr.hid td{opacity:.45}
.link{color:#1e5aa8;cursor:pointer;font-weight:700;background:none;border:0;padding:0}
.heat td{text-align:center;font-weight:700;min-width:46px}
.h0{background:#eceae4;color:#9a9a9a}.h1{background:#f8d7d5;color:#7a2421}.h2{background:#fbeccb;color:#6b4e00}.h3{background:#d7efe1;color:#17573a}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.bar{height:8px;border-radius:99px;background:#eee;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:5}
.modal .card{max-width:760px;width:100%}
.empty{color:var(--muted);text-align:center;padding:30px}
.gate{max-width:420px;margin:60px auto;text-align:center}
.small{font-size:13px;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.form label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
input::placeholder{text-transform:none}
.form input,.form select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
.tg{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.tg.off{opacity:.55}
.tg h3{margin:0;font-size:15px}
.tg details{margin-top:8px}
.tg summary{cursor:pointer;font-weight:700;font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;background:#eee5cf;margin:2px 4px 2px 0}
.pill.ok{background:#d7efe1;color:#17573a}.pill.no{background:#f8d7d5;color:#7a2421}
</style>
</head>
<body>
<header><h1>Rihlah <span>Ilmu</span> · Admin</h1><span class="upd" id="upd"></span><button class="btn gold" id="ref">Muat ulang</button></header>
<div class="wrap" id="main"><p class="empty">Memuat data…</p></div>

<script src="config.js"></script>
<script>
const KELAS_MTS = ['VII','VIII','IX'], KELAS_MA = ['X','XI','XII'], KELAS_ALL = KELAS_MTS.concat(KELAS_MA, ['Umum']);
const URUT_KELAS = k => { const i = KELAS_ALL.indexOf(k); return i < 0 ? 99 : i; };
const API_URL = /^https:\/\//.test(String(window.RIHLAH_API_URL || "").trim()) ? String(window.RIHLAH_API_URL).trim() : "";   // diatur di file config.js
const DEMO_ADMIN = /*DEMO_ADMIN*/null;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => d ? new Date(d).toLocaleString('id-ID', {day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '-';
const avg = a => a.length ? Math.round(a.reduce((s, x) => s + x, 0) / a.length) : null;
const kunciAdmin = () => (location.hash.match(/[#&]k=([^&]+)/) || [])[1] || '';
const kunciGuru = () => (location.hash.match(/[#&]g=([^&]+)/) || [])[1] || '';
const isGuru = () => D && D.peran === 'guru';
const auth = () => kunciGuru() && !kunciAdmin() ? {g: kunciGuru()} : {k: kunciAdmin()};
const milikRombel = (r, t) => !t || (r || '') === t || String(r || '').indexOf(t + '-') === 0;
let D = null, TAB = 'ringkasan', F = {kelas: 'Semua', jalur: '', rentang: '30', cari: '', rombel: ''}, SORT = {k: 'terakhir', d: -1};

async function muat(){
  if (DEMO_ADMIN) { D = DEMO_ADMIN; return tampil(); }
  const k = kunciAdmin() || kunciGuru();
  if (!API_URL || !k) {
    $('#main').innerHTML = `<div class="card gate"><h2>Butuh link admin</h2><p class="small">Buka halaman ini memakai link admin yang berisi kode rahasia, contoh: admin.html#k=KODE. Kode admin ada di Google Sheet, menu Rihlah Ilmu &gt; Tampilkan kode admin.<br><br>Anda guru dari sekolah lain? <a href="guru.html">Daftar dan dapatkan link guru di sini</a>.${API_URL ? '' : '<br><br>API_URL di dalam admin.html juga belum diisi.'}</p></div>`;
    return;
  }
  $('#main').innerHTML = '<p class="empty">Memuat data…</p>';
  try {
    const a = auth(); const r = await fetch(API_URL + '?action=admin&' + (a.g ? 'g=' + encodeURIComponent(a.g) : 'k=' + encodeURIComponent(a.k)));
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    D = j; tampil();
  } catch (e) {
    $('#main').innerHTML = `<div class="card gate"><h2>Gagal memuat</h2><p class="small">${String(e.message).includes('kode_admin') ? (kunciGuru() ? 'Link guru tidak berlaku atau sudah dinonaktifkan. Hubungi pengelola Rihlah Ilmu.' : 'Kode admin salah atau sudah diganti.') : 'Periksa koneksi internet dan URL server.'}</p></div>`;
  }
}
$('#ref').onclick = muat;

/* ---------- olah data ---------- */
function batasWaktu(){ return F.rentang === 'semua' ? 0 : Date.now() - (+F.rentang) * 864e5; }
function hasilTersaring(){
  const t = batasWaktu();
  const pk = {}; D.pemain.forEach(p => pk[p.id_pemain] = p);
  return D.hasil.filter(h => {
    if (t && new Date(h.waktu).getTime() < t) return false;
    if (F.kelas !== 'Semua' && h.kelas_pemain !== F.kelas) return false;
    if (F.jalur && (h.wilayah + '|' + h.mapel) !== F.jalur) return false;
    if (F.rombel && (pk[h.id_pemain] || {}).rombel !== F.rombel) return false;
    return pk[h.id_pemain];
  });
}
function daftarJalur(){
  const s = new Set(D.hasil.map(h => h.wilayah + '|' + h.mapel));
  D.materi.forEach(m => s.add(m.kelas + '|' + m.mapel));
  return [...s].sort((a, b) => { const [ka, ma] = a.split('|'), [kb, mb] = b.split('|'); return URUT_KELAS(ka) - URUT_KELAS(kb) || (ma < mb ? -1 : 1); });
}
const cocokRombel = p => !F.rombel || (p.rombel || '') === F.rombel;
function judulBab(kelas, mapel, no){ const m = D.materi.find(x => x.kelas === kelas && x.mapel === mapel && x.no_bab === no); return m ? m.judul_bab : 'Bab ' + no; }

/* ---------- tampilan ---------- */
function tampil(){
  $('#upd').textContent = 'Data per ' + fmt(D.dibuat);
  document.querySelector('header h1').innerHTML = isGuru() ? `Rihlah <span>Ilmu</span> · Guru` : `Rihlah <span>Ilmu</span> · Admin`;
  const jalurOpt = daftarJalur().map(j => { const [k, m] = j.split('|'); return `<option value="${esc(j)}" ${F.jalur === j ? 'selected' : ''}>${esc(m)} kelas ${esc(k)}</option>`; }).join('');
  $('#main').innerHTML = `
    ${isGuru() ? `<div class="card" style="background:#eaf2fb;border-left:6px solid #4a90c8"><b>Assalamu'alaikum, ${esc(D.guru.nama)}</b>${D.guru.sekolah ? ' · ' + esc(D.guru.sekolah) : ''}<p class="small" style="margin:4px 0 0">Anda melihat siswa dengan kode rombel berawalan <b>${esc(D.guru.awalan)}</b> (contoh: <code>${esc(D.guru.awalan)}-XI-A</code>). Minta siswa mengisi kode rombel itu saat mendaftar, atau lewat Paspor → Ubah nama atau kelas. Link ini khusus untuk Anda, mohon tidak dibagikan. <a href="guru.html">Privasi &amp; kelola pendaftaran</a> · <button class="link" id="hpg" style="color:#a3261e">Hapus pendaftaran saya</button></p></div>` : ''}
    ${DEMO_ADMIN ? '<div class="card small" style="background:#fff4d8">Pratinjau dengan <b>data contoh</b> (bukan pemain sungguhan). Versi asli menampilkan data dari Google Sheet.</div>' : ''}
    <nav>${[['ringkasan','Ringkasan'],['pemain','Daftar Pemain'],['tugas','Tugas'],['peta','Peta Kemampuan'],['soal','Analisis Soal'],['unduh','Unduh Data']].map(([k, n]) => `<button data-t="${k}" class="${TAB === k ? 'on' : ''}">${n}</button>`).join('')}</nav>
    <div class="filters">
      <select id="fk">${['Semua'].concat(KELAS_ALL).map(k => `<option ${F.kelas === k ? 'selected' : ''} value="${k}">${k === 'Semua' ? 'Semua kelas pemain' : 'Pemain kelas ' + k}</option>`).join('')}</select>
      <select id="fj"><option value="">Semua jalur</option>${jalurOpt}</select>
      ${rombelList().length ? `<select id="fb"><option value="">Semua rombel</option>${rombelList().map(r => `<option ${F.rombel === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select>` : ''}
      <select id="fr">${[['7','7 hari terakhir'],['30','30 hari terakhir'],['90','90 hari terakhir'],['semua','Semua waktu']].map(([v, n]) => `<option value="${v}" ${F.rentang === v ? 'selected' : ''}>${n}</option>`).join('')}</select>
    </div>
    <div id="isi"></div>`;
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => { TAB = b.dataset.t; tampil(); });
  $('#fk').onchange = e => { F.kelas = e.target.value; tampil(); };
  $('#fj').onchange = e => { F.jalur = e.target.value; tampil(); };
  $('#fr').onchange = e => { F.rentang = e.target.value; tampil(); };
  if ($('#fb')) $('#fb').onchange = e => { F.rombel = e.target.value; tampil(); };
  if ($('#hpg')) $('#hpg').onclick = async () => {
    if (!confirm('Hapus pendaftaran guru Anda? Link ini akan langsung tidak berlaku dan tidak bisa dipulihkan.')) return;
    try {
      if (!DEMO_ADMIN) { const r = await fetch(API_URL, {method: 'POST', body: JSON.stringify({action: 'hapusGuru', g: kunciGuru()})}); const j = await r.json(); if (!j.ok) throw new Error(j.error); }
      $('#main').innerHTML = '<div class="card gate"><h2>Pendaftaran dihapus</h2><p class="small">Data guru Anda sudah dihapus dan link ini tidak berlaku lagi. Terima kasih telah memakai Rihlah Ilmu.</p></div>';
    } catch (e) { alertBox('Gagal menghapus: ' + e.message); }
  };
  ({ringkasan, pemain: tabPemain, tugas: tabTugas, peta, soal: tabSoal, unduh})[TAB]();
}

function ringkasan(){
  const H = hasilTersaring();
  const P = D.pemain.filter(p => (F.kelas === 'Semua' || p.kelas === F.kelas) && cocokRombel(p));
  const hariIni = new Date(); hariIni.setHours(0, 0, 0, 0);
  const aktif7 = new Set(D.hasil.filter(h => new Date(h.waktu) >= Date.now() - 7 * 864e5).map(h => h.id_pemain));
  const mainHariIni = H.filter(h => new Date(h.waktu) >= hariIni).length;
  const perKelas = KELAS_ALL.map(k => {
    const ps = D.pemain.filter(p => p.kelas === k), hs = H.filter(h => h.kelas_pemain === k);
    if (!ps.length && !hs.length) return '';
    return `<tr><td>${k}</td><td class="num">${ps.length}</td><td class="num">${hs.length}</td><td class="num">${avg(hs.map(h => h.nilai)) ?? '-'}</td></tr>`;
  }).join('');
  const hit = {};
  H.filter(h => h.jenis_tahap === 'manzil').forEach(h => { const k = h.wilayah + '|' + h.mapel + '|' + h.no_bab; (hit[k] = hit[k] || []).push(h.nilai); });
  const top = Object.entries(hit).sort((a, b) => b[1].length - a[1].length).slice(0, 8).map(([k, v]) => {
    const [kl, mp, no] = k.split('|');
    return `<tr><td>${esc(mp)} ${kl} · ${no}. ${esc(judulBab(kl, mp, +no))}</td><td class="num">${v.length}</td><td class="num">${avg(v)}</td></tr>`;
  }).join('');
  $('#isi').innerHTML = pekanIni() + `<div class="kpis">
      <div class="kpi"><b>${P.length}</b><span>Pemain terdaftar</span></div>
      <div class="kpi"><b>${aktif7.size}</b><span>Aktif 7 hari terakhir</span></div>
      <div class="kpi"><b>${mainHariIni}</b><span>Permainan hari ini</span></div>
      <div class="kpi"><b>${H.length}</b><span>Permainan dalam filter</span></div>
      <div class="kpi"><b>${avg(H.map(h => h.nilai)) ?? '-'}</b><span>Rata-rata nilai</span></div>
      <div class="kpi"><b>${new Set(D.hasil.filter(h => h.jenis_tahap === 'ijazah' && h.nilai >= 70).map(h => h.id_pemain + h.wilayah)).size}</b><span>Ijazah diraih</span></div>
    </div>
    <div class="card"><h2>Per kelas pemain</h2><table><tr><th>Kelas</th><th class="num">Pemain</th><th class="num">Permainan</th><th class="num">Rata-rata nilai</th></tr>${perKelas}</table></div>
    <div class="card"><h2>Manzil paling banyak dimainkan</h2>${top ? `<table><tr><th>Manzil</th><th class="num">Dimainkan</th><th class="num">Rata-rata</th></tr>${top}</table>` : '<p class="empty">Belum ada permainan dalam filter ini.</p>'}</div>`;
}

function pekanIni(){
  const now = Date.now(), d7 = now - 7 * 864e5, d14 = now - 14 * 864e5;
  const pk = {}; D.pemain.forEach(p => pk[p.id_pemain] = p);
  const ok = h => pk[h.id_pemain] && !pk[h.id_pemain].disembunyikan && (F.kelas === 'Semua' || h.kelas_pemain === F.kelas) && cocokRombel(pk[h.id_pemain]);
  const A = D.hasil.filter(h => ok(h) && new Date(h.waktu) >= d7), B = D.hasil.filter(h => ok(h) && new Date(h.waktu) >= d14 && new Date(h.waktu) < d7);
  const ua = new Set(A.map(h => h.id_pemain)).size, ub = new Set(B.map(h => h.id_pemain)).size;
  const ra = avg(A.map(h => h.nilai)), rb = avg(B.map(h => h.nilai));
  const delta = (x, y, suf = '') => y == null || x == null ? '' : x === y ? '<span class="small">sama</span>' : `<span style="color:${x > y ? '#17573a' : '#a33'};font-size:13px;font-weight:700">${x > y ? '▲' : '▼'} ${Math.abs(x - y)}${suf}</span>`;
  const baru = D.pemain.filter(p => !p.disembunyikan && (F.kelas === 'Semua' || p.kelas === F.kelas) && cocokRombel(p) && new Date(p.pertama_main) >= d7).length;
  const lama = D.pemain.filter(p => !p.disembunyikan && (F.kelas === 'Semua' || p.kelas === F.kelas) && cocokRombel(p) && p.terakhir_main && new Date(p.terakhir_main) < d7 && new Date(p.terakhir_main) >= now - 30 * 864e5);
  const per = {};
  A.filter(h => h.jenis_tahap === 'manzil').forEach(h => { const k = h.wilayah + '|' + h.mapel + '|' + h.no_bab; (per[k] = per[k] || []).push(h.nilai); });
  const sulit = Object.entries(per).filter(([, v]) => v.length >= 3).map(([k, v]) => ({k, n: v.length, r: avg(v)})).sort((a, b) => a.r - b.r).slice(0, 3);
  const tugas = (D.tugas || []).filter(t => t.aktif).map(t => ({t, st: statusTugas(t)})).filter(x => x.st.peserta.length).sort((a, b) => a.st.sudah.length / a.st.peserta.length - b.st.sudah.length / b.st.peserta.length).slice(0, 3);
  const soal = D.soal.filter(x => x.n >= 5).map(x => ({...x, pct: Math.round(x.benar / x.n * 100)})).sort((a, b) => a.pct - b.pct).slice(0, 3);
  return `<div class="card" style="border-left:6px solid var(--gold)"><h2>📅 Ringkasan 7 hari terakhir</h2>
    <div class="kpis" style="margin-bottom:6px">
      <div class="kpi" style="background:#faf7f0"><b>${ua}</b><span>pemain aktif ${delta(ua, ub)}</span></div>
      <div class="kpi" style="background:#faf7f0"><b>${A.length}</b><span>permainan ${delta(A.length, B.length)}</span></div>
      <div class="kpi" style="background:#faf7f0"><b>${ra ?? '-'}</b><span>rata-rata nilai ${delta(ra, rb)}</span></div>
      <div class="kpi" style="background:#faf7f0"><b>${baru}</b><span>pemain baru</span></div>
    </div>
    <p class="small" style="margin:0 0 10px">Panah membandingkan dengan 7 hari sebelumnya. Mengikuti filter kelas dan rombel.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;font-size:14px">
      <div><b>🔻 Manzil terlemah pekan ini</b>${sulit.length ? '<ol style="margin:6px 0 0;padding-left:18px">' + sulit.map(x => { const [kl, mp, no] = x.k.split('|'); return `<li>${esc(mp)} ${kl} · ${no}. ${esc(judulBab(kl, mp, +no))} <span class="small">(rata-rata ${x.r}, ${x.n}×)</span></li>`; }).join('') + '</ol><p class="small" style="margin:4px 0 0">Kandidat untuk dijelaskan ulang di kelas.</p>' : '<p class="small">Belum cukup data (minimal 3 permainan per manzil).</p>'}</div>
      <div><b>📌 Tugas paling tertinggal</b>${tugas.length ? '<ul style="margin:6px 0 0;padding-left:18px">' + tugas.map(x => `<li>${esc(x.t.judul)} <span class="small">· ${x.st.sudah.length}/${x.st.peserta.length} selesai, ${x.st.belum.length} belum mulai</span></li>`).join('') + '</ul>' : '<p class="small">Tidak ada tugas aktif.</p>'}</div>
      <div><b>❓ Soal paling sering keliru</b>${soal.length ? '<ul style="margin:6px 0 0;padding-left:18px">' + soal.map(x => `<li>${esc(String(x.pertanyaan).slice(0, 70))}${String(x.pertanyaan).length > 70 ? '…' : ''} <span class="small">(${x.pct}% benar)</span></li>`).join('') + '</ul><p class="small" style="margin:4px 0 0">Cek kuncinya di tab Analisis Soal.</p>' : '<p class="small">Belum cukup data.</p>'}</div>
      <div><b>💤 Lama tidak bermain</b><p class="small" style="margin:6px 0 0">${lama.length ? `${lama.length} pemain aktif bulan ini tetapi tidak bermain 7 hari terakhir: ${lama.slice(0, 8).map(p => esc(p.nama)).join(', ')}${lama.length > 8 ? ', …' : ''}` : 'Tidak ada. Semua pemain bulan ini masih aktif.'}</p></div>
    </div></div>`;
}

function statPemain(){
  const H = hasilTersaring();
  return D.pemain.filter(p => (F.kelas === 'Semua' || p.kelas === F.kelas) && cocokRombel(p))
    .filter(p => !F.cari || p.nama.toLowerCase().includes(F.cari.toLowerCase()))
    .map(p => {
      const hs = H.filter(h => h.id_pemain === p.id_pemain);
      const best = {};
      hs.filter(h => h.jenis_tahap === 'manzil').forEach(h => { const k = h.wilayah + h.mapel + h.no_bab; best[k] = Math.max(best[k] || 0, h.nilai); });
      const b = Object.values(best);
      return {...p, main: hs.length, tuntas: b.filter(x => x >= 50).length, rata: avg(b), bintang: b.reduce((s, x) => s + (x >= 90 ? 3 : x >= 70 ? 2 : x >= 50 ? 1 : 0), 0), terakhir: p.terakhir_main};
    });
}
function tabPemain(){

function kls(v){ return v == null ? 'h0' : v >= 80 ? 'h3' : v >= 50 ? 'h2' : 'h1'; }
function peta(){
  const jalur = F.jalur || daftarJalur()[0];
  if (!jalur) { $('#isi').innerHTML = '<p class="empty">Belum ada data.</p>'; return; }
  const [kl, mp] = jalur.split('|');
  const babs = D.materi.filter(m => m.kelas === kl && m.mapel === mp).map(m => m.no_bab).sort((a, b) => a - b);
  const H = hasilTersaring().filter(h => h.wilayah === kl && h.mapel === mp && h.jenis_tahap === 'manzil');
  // nilai terbaik per pemain per bab, lalu dirata-rata
  const best = {};
  H.forEach(h => { const k = h.id_pemain + '|' + h.no_bab; best[k] = Math.max(best[k] || 0, h.nilai); });
  const pk = {}; D.pemain.forEach(p => pk[p.id_pemain] = p);
  const baris = KELAS_ALL.filter(k => (F.kelas === 'Semua' || F.kelas === k) && Object.keys(best).some(key => (pk[key.split('|')[0]] || {}).kelas === k)).map(k => {
    const cells = babs.map(no => {
      const v = Object.entries(best).filter(([key]) => { const [id, n] = key.split('|'); return +n === no && pk[id] && pk[id].kelas === k; }).map(([, v]) => v);
      const a = avg(v);
      return `<td class="${kls(a)}" title="${v.length} pemain">${a ?? '·'}</td>`;
    }).join('');
    return `<tr><th style="position:static;cursor:default">Kelas ${k}</th>${cells}</tr>`;

  const baris2 = pem.map(p => `<tr><td style="white-space:nowrap">${esc(p.nama)} <span class="small">${esc(p.kelas)}</span></td>${babs.map(no => { const v = best[p.id_pemain + '|' + no]; return `<td class="${kls(v)}">${v ?? '·'}</td>`; }).join('')}</tr>`).join('');

    <p class="small" style="margin-top:8px">${babs.map(no => no + '. ' + esc(judulBab(kl, mp, no))).join(' · ')}</p></div>
    <div class="card"><h2>Per pemain (nilai terbaik)</h2>${pem.length ? `<table class="heat"><tr><th style="position:static">Pemain</th>${babs.map(no => `<th class="num">${no}</th>`).join('')}</tr>${baris2}</table>` : '<p class="empty">Belum ada pemain di jalur ini dalam filter.</p>'}</div>`;
}

function statusTugas(t){
  const peserta = D.pemain.filter(p => !p.disembunyikan && p.kelas === t.kelas && milikRombel(p.rombel, t.rombel));
  const babs = []; for (let n = t.bab_dari; n <= t.bab_sampai; n++) babs.push(n);
  const tuntas = {};
  D.hasil.forEach(h => { if (h.jenis_tahap === 'manzil' && h.wilayah === t.kelas && h.mapel === t.mapel && h.bintang >= 1 && babs.includes(h.no_bab)) (tuntas[h.id_pemain] = tuntas[h.id_pemain] || new Set()).add(h.no_bab); });
  const sudah = peserta.filter(p => tuntas[p.id_pemain] && tuntas[p.id_pemain].size === babs.length);
  const sebagian = peserta.filter(p => tuntas[p.id_pemain] && tuntas[p.id_pemain].size < babs.length);
  const belum = peserta.filter(p => !tuntas[p.id_pemain]);
  return {peserta, sudah, sebagian, belum, tuntas, n: babs.length};
}

      <tr><td>Mulai bermain</td><td>${fmt(p.pertama_main)}</td><td>Terakhir bermain</td><td>${fmt(p.terakhir_main)}</td></tr></table>
      <div class="kp"><div><b>${hs.length}</b>permainan</div><div><b>${semua.filter(v => v >= 50).length}</b>manzil tuntas</div><div><b>${avg(semua) ?? '-'}</b>rata-rata nilai</div><div><b>${Object.values(ijz).filter(v => v >= 70).length}</b>ijazah</div></div>
      ${jalur || '<p>Belum ada manzil yang dimainkan.</p>'}
      ${lemah.length ? `<p class="saran"><b>Saran:</b> ulangi ${lemah.join(', ')}.</p>` : ''}
      <div class="ttd"><div>Siswa<br><br><br>( ${esc(p.nama)} )</div><div>Guru PAI<br><br><br>( ........................................ )</div></div></section>`;
  }).join('');
  const w = window.open('', '_blank');
  if (!w) { alertBox('Jendela cetak diblokir browser. Izinkan pop-up untuk halaman ini.'); return; }
  w.document.write(`<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><title>Rapor Rihlah Ilmu</title><style>
    body{font-family:'Plus Jakarta Sans',Arial,sans-serif;color:#1d2433;margin:0}
    section{padding:28px 34px;page-break-after:always}section:last-child{page-break-after:auto}
    header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #b58a2a;padding-bottom:8px;margin-bottom:14px}
    .brand{color:#8a6a1c;font-weight:800;font-size:12px;letter-spacing:1px}h1{margin:2px 0 0;font-size:22px}.tgl{font-size:12px;color:#666}
    table{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0 12px}th,td{border:1px solid #ddd;padding:5px 8px;text-align:left}th{background:#f6f1e3}
    .id td{border:0;padding:3px 6px}.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 14px}.kp div{border:1.5px solid #e7dcc0;border-radius:8px;padding:8px;text-align:center;font-size:12px}.kp b{display:block;font-size:20px}
    h3{font-size:14px;margin:14px 0 2px}h3 small{font-weight:600;color:#666}.saran{background:#fff6e3;border:1px solid #f0d9a6;border-radius:8px;padding:8px 10px;font-size:12.5px}
    .ttd{display:flex;justify-content:space-between;margin-top:30px;font-size:13px;text-align:center}.ttd div{width:45%}
    @media print{.noprint{display:none}}</style></head><body><div class="noprint" style="padding:10px;background:#14213d;color:#fff;text-align:center;font-family:Arial">${ids.length} rapor siap. <button onclick="print()">🖨 Cetak / Simpan PDF</button></div>${halaman}</body></html>`);
  w.document.close();
  setTimeout(() => { try { w.focus(); w.print(); } catch (e) {} }, 500);
}

function alertBox(msg){ const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="card" style="max-width:380px"><p>${esc(msg)}</p><button class="btn gold">OK</button></div>`; document.body.appendChild(m); m.querySelector('button').onclick = () => m.remove(); }
